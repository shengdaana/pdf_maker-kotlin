name: pdf_maker
description: "A private, zero-tracker, elder-friendly Photos to PDF converter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Photo selection via system photo picker (no storage permissions needed)
  image_picker: ^1.1.2
  # 100% open-source PDF generator (runs fully offline, no internet, no Play Services)
  pdf: ^3.11.1
  # App & documents directory path resolution
  path_provider: ^2.1.4
  # File sharing intent (WhatsApp, Email, Drive, etc.)
  share_plus: ^10.0.2
  # Open-source image processing & compression (JPEG re-encoding)
  image: ^4.3.0
  # Lightweight offline persistent settings
  shared_preferences: ^2.3.2
  # Date formatting for default filenames
  intl: ^0.19.0
  # Cupertino icons for cross-platform compatibility
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
