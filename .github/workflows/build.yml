name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kotlin-android:
    name: Build Native Android (Kotlin) APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare Environment and Keystore
        run: |
          # Ensure .env exists for Secrets Gradle Plugin
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Decode or create debug.keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf_maker_kotlin_apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-flutter:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses for Flutter
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Install Flutter Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Flutter APK
        run: |
          cd flutter_app
          flutter build apk --debug

      - name: Upload Flutter APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf_maker_flutter_apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
